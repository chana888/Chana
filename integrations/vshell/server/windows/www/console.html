<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vShell 命令控制台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0d1117;color:#c9d1d9;font-family:'Cascadia Code','Fira Code','JetBrains Mono','Consolas','Courier New',monospace;font-size:14px;overflow:hidden}
.console-wrapper{display:flex;flex-direction:column;height:100vh}
.console-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:#161b22;border-bottom:1px solid #30363d;flex-shrink:0;min-height:42px}
.console-header .title{font-size:13px;font-weight:600;color:#8b949e;display:flex;align-items:center;gap:8px}
.console-header .title .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.console-header .title .dot.online{background:#3fb950;box-shadow:0 0 6px #3fb95088}
.console-header .title .dot.offline{background:#f85149}
.console-header .info{font-size:12px;color:#484f58;display:flex;align-items:center;gap:12px}
.console-header .info .badge{padding:2px 8px;border-radius:4px;font-size:11px;background:#21262d;color:#8b949e;border:1px solid #30363d}
.console-header .actions{display:flex;gap:6px}
.console-header .actions button{background:#21262d;border:1px solid #30363d;color:#c9d1d9;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s}
.console-header .actions button:hover{background:#30363d;border-color:#8b949e}
.console-header .actions button.danger:hover{background:#f8514944;border-color:#f85149;color:#f85149}
.console-header .actions button.primary{background:#238636;border-color:#238636;color:#fff}
.console-header .actions button.primary:hover{background:#2ea043}
.console-output{flex:1;overflow-y:auto;padding:12px 0;background:#0d1117}
.console-output::-webkit-scrollbar{width:6px}
.console-output::-webkit-scrollbar-track{background:#0d1117}
.console-output::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
.console-output::-webkit-scrollbar-thumb:hover{background:#484f58}
.output-line{padding:1px 16px;line-height:1.6;white-space:pre-wrap;word-break:break-all;font-size:13px;min-height:0;animation:fadeIn .08s ease}
.output-line.cmd-line{color:#58a6ff;font-weight:500}
.output-line.cmd-line::before{content:'$ ';color:#3fb950;font-weight:400}
.output-line.output-text{color:#c9d1d9}
.output-line.error-text{color:#f85149}
.output-line.info-text{color:#8b949e;font-style:italic;font-size:12px}
.output-line.divider-line{color:#21262d;text-align:center;border-top:1px solid #21262d;margin:4px 0;padding:0}
.output-line.empty-line{padding:0;height:0;margin:0;min-height:0}
@keyframes fadeIn{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:translateY(0)}}
.console-input-wrap{flex-shrink:0;padding:8px 16px 10px;background:#161b22;border-top:1px solid #30363d}
.console-input-row{display:flex;align-items:center;gap:4px;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:2px;transition:border-color .15s}
.console-input-row:focus-within{border-color:#58a6ff}
.console-prompt{color:#3fb950;padding:4px 0 4px 10px;font-size:13px;user-select:none;flex-shrink:0}
.console-input{flex:1;background:transparent;border:none;outline:none;color:#c9d1d9;font-family:inherit;font-size:13px;padding:4px 6px;caret-color:#58a6ff}
.console-input::placeholder{color:#484f58;font-size:12px}
.console-send-btn{background:#238636;border:1px solid #238636;color:#fff;padding:4px 14px;border-radius:4px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s;flex-shrink:0}
.console-send-btn:hover{background:#2ea043}
.console-send-btn:disabled{background:#21262d;border-color:#30363d;color:#484f58;cursor:not-allowed}
.console-status{flex-shrink:0;padding:2px 16px 6px;font-size:11px;color:#484f58;display:flex;justify-content:space-between}
.console-status .hint{color:#484f58}
.console-status .hint kbd{background:#21262d;border:1px solid #30363d;padding:1px 5px;border-radius:3px;font-size:10px;font-family:inherit}
/* loading dots */
.loading-dots::after{content:'';animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%,20%{content:''}40%{content:'.'}60%{content:'..'}80%,100%{content:'...'}}
/* responsive */
@media(max-width:640px){
  .console-header .info{display:none}
  .console-header .title{font-size:12px}
  .output-line{padding:1px 10px;font-size:12px}
  .console-input-wrap{padding:6px 8px 8px}
}
</style>
</head>
<body>
<div class="console-wrapper">
  <div class="console-header">
    <div class="title">
      <span class="dot online" id="statusDot"></span>
      <span>vShell 命令控制台</span>
      <span class="badge" id="clientBadge">客户端 #--</span>
    </div>
    <div class="info">
      <span id="osBadge" class="badge">--</span>
      <span id="hostBadge" class="badge">--</span>
    </div>
    <div class="actions">
      <button class="primary" onclick="clearOutput()">清屏</button>
      <button onclick="toggleWrap()" id="wrapBtn">自动换行</button>
      <button class="danger" onclick="closeConsole()">关闭</button>
    </div>
  </div>

  <div class="console-output" id="output"></div>

  <div class="console-input-wrap">
    <div class="console-input-row">
      <span class="console-prompt">$</span>
      <input id="cmdInput" class="console-input" type="text" placeholder="输入命令，按 Enter 执行..." autofocus spellcheck="false" autocomplete="off">
      <button id="sendBtn" class="console-send-btn" onclick="execCmd()">执行</button>
    </div>
  </div>

  <div class="console-status">
    <span id="statusText" class="hint">已连接</span>
    <span class="hint"><kbd>↑</kbd><kbd>↓</kbd> 历史  <kbd>Tab</kbd> 补全  <kbd>Ctrl+L</kbd> 清屏</span>
  </div>
</div>

<script>
// ====== Config ======
const params = new URLSearchParams(location.search);
const CLIENT_ID = parseInt(params.get('id')) || 0;
const TOKEN = params.get('token') || localStorage.getItem('TOKEN__') || localStorage.getItem('token') || '';
const API_BASE = params.get('api') || '';

// ====== State ======
let commandHistory = [];
let historyIdx = -1;
let isLoading = false;
let wrapMode = true;

// ====== DOM refs ======
const outputEl = document.getElementById('output');
const cmdInput = document.getElementById('cmdInput');
const sendBtn = document.getElementById('sendBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const clientBadge = document.getElementById('clientBadge');
const osBadge = document.getElementById('osBadge');
const hostBadge = document.getElementById('hostBadge');

// ====== API ======
function getApiUrl(path) {
  if (API_BASE) return API_BASE.replace(/\/+$/, '') + path;
  return path;
}

async function apiCall(url, data) {
  const headers = {'Content-Type': 'application/json'};
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;

  const resp = await fetch(getApiUrl(url), {
    method: 'POST',
    headers,
    body: JSON.stringify(data)
  });

  // Try to read token from response header
  const respToken = resp.headers.get('Authorization') || resp.headers.get('token');
  if (respToken && !TOKEN) {
    localStorage.setItem('token', respToken);
  }

  return resp.json();
}

// ====== Output ======
function addLine(text, className = 'output-text') {
  const div = document.createElement('div');
  div.className = 'output-line ' + className;
  div.textContent = text;
  outputEl.appendChild(div);
  scrollToBottom();
  return div;
}

function addOutput(text) {
  if (!text) return;
  // Split by newlines, add each line
  const lines = text.split(/\r?\n/);
  lines.forEach(line => {
    if (line === '') {
      const empty = document.createElement('div');
      empty.className = 'output-line empty-line';
      empty.innerHTML = '&nbsp;';
      outputEl.appendChild(empty);
    } else {
      addLine(line, 'output-text');
    }
  });
  scrollToBottom();
}

function clearOutput() {
  outputEl.innerHTML = '';
  addLine('输出已清空', 'info-text');
}

function scrollToBottom() {
  outputEl.parentElement.scrollTop = outputEl.parentElement.scrollHeight;
}

function setLoading(loading) {
  isLoading = loading;
  sendBtn.disabled = loading;
  cmdInput.disabled = loading;
  if (loading) {
    sendBtn.textContent = '执行中';
    statusText.textContent = '执行中...';
  } else {
    sendBtn.textContent = '执行';
    statusText.textContent = '就绪';
    cmdInput.focus();
  }
}

function toggleWrap() {
  wrapMode = !wrapMode;
  outputEl.style.whiteSpace = wrapMode ? 'pre-wrap' : 'pre';
  document.getElementById('wrapBtn').textContent = wrapMode ? '自动换行' : '不换行';
}

// ====== Command Execution ======
async function execCmd() {
  const cmd = cmdInput.value.trim();
  if (!cmd || isLoading) return;

  // Add to history
  if (cmd !== commandHistory[commandHistory.length - 1]) {
    commandHistory.push(cmd);
  }
  historyIdx = commandHistory.length;

  // Clear input
  cmdInput.value = '';

  // Display command
  addLine(cmd, 'cmd-line');

  // Execute
  setLoading(true);
  try {
    const resp = await apiCall('/terminal/shell', {id: CLIENT_ID, command: cmd});
    if (resp.code === 0) {
      addOutput(resp.result);
    } else {
      addLine(resp.message || '执行失败', 'error-text');
    }
  } catch (err) {
    addLine('请求失败: ' + err.message, 'error-text');
  }
  setLoading(false);
}

// ====== History ======
function historyUp() {
  if (commandHistory.length === 0) return;
  if (historyIdx > 0) {
    historyIdx--;
    cmdInput.value = commandHistory[historyIdx];
  }
}

function historyDown() {
  if (historyIdx < commandHistory.length - 1) {
    historyIdx++;
    cmdInput.value = commandHistory[historyIdx];
  } else {
    historyIdx = commandHistory.length;
    cmdInput.value = '';
  }
}

// ====== Keyboard ======
cmdInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    execCmd();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    historyUp();
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    historyDown();
  } else if (e.key === 'l' && e.ctrlKey) {
    e.preventDefault();
    clearOutput();
  }
});

// ====== Init ======
async function init() {
  clientBadge.textContent = '客户端 #' + CLIENT_ID;
  addLine('═══════════════════════════════════════════', 'info-text');
  addLine('vShell 命令控制台 | 客户端 #' + CLIENT_ID, 'info-text');
  addLine('输入 help 查看可用命令 | Ctrl+L 清屏', 'info-text');
  addLine('═══════════════════════════════════════════', 'info-text');
  addLine('', 'empty-line');

  // Fetch client info
  try {
    const resp = await apiCall('/client/list', {});
    if (resp.code === 0 && resp.result) {
      const clients = Array.isArray(resp.result) ? resp.result :
                      resp.result.items || resp.result.list || [];
      const client = clients.find(c => c.Id === CLIENT_ID || c.id === CLIENT_ID);
      if (client) {
        const os = client.OsName || client.osName || '--';
        const host = client.HostName || client.hostName || client.Addr || '--';
        osBadge.textContent = os;
        hostBadge.textContent = host;
      }
    }
  } catch(e) {
    // non-fatal
  }

  cmdInput.focus();
}

function closeConsole() { window.close(); }

init();
</script>
</body>
</html>
