	<script type="text/javascript">
		var _IS_VALID_CAPTCHA = false;
		if (window != top) {
			proxyLocation(top).href = window.location;
		}

		$(function() {
			mini.parse();
			var userName = getCNAME();
			$('#username').val(userName);
			
			isValidCaptcha(userName);
			ewmmHover();
		});

		//判断是否需要显示验证码
		function isValidCaptcha(userName){
			var url = '/EIP/nonlogin/login/captcha/isvalid.htm';
			$.post(url, {username:userName}, function(valid){
				if (valid) {
					_IS_VALID_CAPTCHA = true;
					$('.img-boxes').show();
					changeimg();
				} else {
					$('.img-boxes').hide();
				}
			});
		}
		
		//回车事件
		$(document).keydown(function(event) {
			if (event.keyCode == 13) {
				login();
			}
		});

		//重置方法
		function resetForm() {
			if (loginPending) {
				return;
			}
			var loginForm = document.getElementById("loginForm");
			loginForm.reset();
		}

		//更换验证码
		function changeimg() {
			var myimg = document.getElementById("code");
			now = new Date();
			myimg.src = "/EIP/nonlogin/login/captcha.htm?code="+now.getTime();
		}

		function validation() {
			var value = $("#password").val();
			if(""!=value) {
				var intScore = checkPassword(value);
				if(intScore< 50){
					alert("当前密码过于简单，存在安全风险。\n\n一个安全的密码应该是至少6位，并且由大小写字母、数字、特殊符号所组成的，建议您尽快更改密码!");
				}
			}
		}
		
		var loginPending = false;
		function login() {
			if (loginPending) {
				return;
			}

			var username = $("#username").val();
			var password = $("#password").val();
			var verification = $("#verification").val();
			if (!username) {
				alert("请输入用户名");
				$("#username").focus();
				return;
			}
			if (!password) {
				alert("请输入密码");
				$("#password").focus();
				return;
			}
			
			if(!$('.img-boxes').is(":hidden")){
				if (_IS_VALID_CAPTCHA && !verification) {
					alert("请输入验证码");
					$("#verification").focus();
					return;
				}
			}
			$("#loading").show();
			loginPending = true;
			
			
			
			if($('.img-boxes').is(":hidden")){
				var url = '/EIP/nonlogin/login/captcha/isvalid.htm';
				$.post(url,{username:username}, function(valid){
					console.log(valid);
					if (valid) {
						_IS_VALID_CAPTCHA = true;
						$('.img-boxes').show();
						changeimg();
						loginPending = false;
						$("#loading").hide();
					} else {
						needChangePwd(username,password,verification);
					}
				});
			}else{
				needChangePwd(username,password,verification);
			}
			
		}

		function needChangePwd(username,password,verification) {
			$.ajax({
				type : 'get',
				url : '/EIP/nonlogin/firstLogin/needChangePwd.htm?userName=' + username,
				success : function (result) {userLogin(username,password,verification,result);},
				dataType : 'text'
			});
		}
		
		function userLogin(username,password,verification,checkPwd){
			$.ajax({
				url : "/EIP/login/Login.htm",
				data : {
					username : username,
					password : hex_md5(password),
					verification : verification
				},
				cache : false,
				type : "post",
				dataType : 'html',
				success : function(text) {
					loginPending = false;
					if (text != "") {
						if(text.indexOf("ukey-") != -1){
							var textArr = text.split("-");
							var userId = textArr[1];
							mini.prompt("请输入令牌口令：", "请输入", function(action, value) {
								if (action == 'ok') {
									$.post('/EIP/nonlogin/login/ukeyLogin.htm', {username: username,password: password, userId: userId, opt : value}, function(message) {
										if (message != "") {
											alert('动态令牌口令错误。');
											changeimg();
										} else {
											var pwdstr={"number":true,"lowercase":true,"uppercase":true,"special":true,"min":8}; //是否开启密码强度检测
											if(pwdstr=="enable") {
												validation();
											}
											setCookie("username", username);
											//登陆后清空miniui历史标签
											$.cookie("historyTabs", null,{path:"/"});
											if (checkPwd == 'true') {
												proxyLocation(window).href = "/EIP/firstLogin/getPage.htm";
											} else {
												proxyLocation(window).href = "/EIP/user/index.htm";
											}
										}
									});
									$("#loading").hide();
								} else {
									$("#loading").hide();
									changeimg();
								}
							});
						}else{
							alert(text);
							changeimg();
							$("#loading").hide(); 
						}
					} else {
						var pwdstr={"number":true,"lowercase":true,"uppercase":true,"special":true,"min":8}; //是否开启密码强度检测
						if(pwdstr=="enable") {
							validation();
						}
						setCookie("username", username);
						//登陆后清空miniui历史标签
						$.cookie("historyTabs", null,{path:"/"});
						if (checkPwd == 'true') {
							proxyLocation(window).href = "/EIP/firstLogin/getPage.htm";
						} else {
							proxyLocation(window).href = "/EIP/user/index.htm";
						}
					}
				},
				error : function(jqXHR, textStatus, errorThrown) {
					$("#loading").hide();
					loginPending = false;
					alert(jqXHR.responseText);
				}
			});
		}

		function hide(){
			$('.img-boxes').hide();
		}
		
		//写cookies
		function setCookie(name, value, path) {
			var Days = 30;
			var exp = new Date();
			exp.setTime(exp.getTime() + Days * 24 * 60 * 60 * 1000);
			var cookie = name + "=" + escape(value) + ";expires="
					+ exp.toGMTString();
			if (path) {
				cookie += ";path=" + path;
			}
			document.cookie = cookie;
		}

		//计算网页正文高度
		var winHt;
		var halfHt;
		var clientHt;
		function winHeight() {
			winHt = $(window).height();
			clientHt = $(document.body).height();
			halfHt = (winHt - clientHt) / 4;
		}

		function webShow() {
			winHeight();
			$(".login-content").height(clientHt-80-120-2);
			$(".login-content-box").height(clientHt-80-120-2);
		}
		
		/* var winHt = $(window).height();;
		var clientHt = $(document.body).height();
		function webShow() {
			$(".login-content").height(clientHt-100-150);
		} */

		$(window).resize(function() {
			winHeight();
			webShow();
		});

		var waitInterval = 0;
		function longConnect() {
			$.ajax({
				url : "/EIP/nonlogin/qrlogin/connect.htm",
				cache : false,
				type : "get",
				dataType : "text",
				success : function(status) {
					if ("scan" == status) {
						$(".login-ewm-ts").css("display", "none");
						$(".login-ewm-ok").css("display", "block");
						$(".login-ewm-no").css("display", "none");
					} else if ("cancel" == status) {
						$(".login-ewm-ts").css("display", "none");
						$(".login-ewm-ok").css("display", "none");
						$(".login-ewm-no").css("display", "block");
					} else if ("login" == status) {
						$.cookie("historyTabs", null,{path:"/"}); 
						proxyLocation(window).href = "/EIP/user/index.htm";
					}

					if ("" == status || "fail" == status) {
						setTimeout(longConnect, waitInterval);
						waitInterval += 1000;
					} else {
						longConnect();
					}
				},
				error : function(jqXHR, textStatus, errorThrown) {
					setTimeout(longConnect, waitInterval);
					waitInterval += 1000;
				}
			});
		}
		
		
		function ewmmHover(){
			$(".login-footer-ewmm").hover(function(){
				$(".login-footer-ewmm-pc").show();
			},function(){
				$(".login-footer-ewmm-pc").hide();
			})
		}
		
	</script>
