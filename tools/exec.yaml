name: "exec"
command: "sh"
args: ["-c"]
enabled: true
# 简短描述（用于工具列表，减少token消耗）
short_description: "系统命令执行工具（Windows cmd；无python3/head，扫描用workflow_scan_a）"
# 工具详细描述
description: |
  系统命令执行工具，用于执行Shell命令和系统操作。

  **⚠️ 本机环境（Windows cmd，必读）：**
  - shell 为 cmd.exe，命令必须用 cmd 语法：双引号包裹（**单引号无效**）
  - **无 python3** → 用 `python`；**无 head/tail/grep/sed/awk** → 用 `findstr` / `more` / PowerShell
  - **无 nmap/rustscan/nuclei 等 Linux 工具**（已禁用）；端口/目录扫描一律 `workflow_scan_a`（A线），不要手写扫描命令
  - 网络请求用 `curl.exe`（Windows 自带）或浏览器 `chrome-devtools__evaluate_script` 页面 fetch
  - 管道 `|` 可用，但两侧命令都必须是 cmd 兼容的
  - **多命令分隔用 `&`**（不是 `;`！`;` 在 cmd 里不是分隔符，会被当成参数导致报错）；换行也可以

  **主要功能：**
  - 执行任意系统命令（cmd 语法）
  - 支持 cmd / PowerShell 命令
  - 可以指定工作目录
  - 返回命令执行结果

  **使用场景：**
  - 系统管理和维护
  - 自动化脚本执行
  - 文件操作和处理
  - 系统信息收集

  **安全警告：**
  - ⚠️ 此工具可以执行任意系统命令，存在安全风险
  - ⚠️ 仅应在受控环境中使用
  - ⚠️ 所有命令执行都会被记录
  - ⚠️ 建议限制可执行的命令范围
  - ⚠️ 不要执行不可信的命令
# 参数定义
parameters:
  - name: "command"
    type: "string"
    description: |
      要执行的系统命令。可以是任何有效的Shell命令。

      **格式要求：**
      - 完整的Shell命令
      - 可以包含管道、重定向等Shell特性
      - 支持环境变量

      **示例值：**
      - 简单命令: "ls -la"
      - 带管道: "ps aux | grep nginx"
      - 文件操作: "cat /etc/passwd"
      - 网络命令: "curl http://example.com"
      - 系统信息: "uname -a"
      - 查找文件: "find /var/log -name '*.log'"

      **注意事项：**
      - 命令会在指定的shell中执行
      - 确保命令语法正确
      - 注意命令的安全影响
      - 必需参数，不能为空
    required: true
    position: 0
    format: "positional"
  - name: "shell"
    type: "string"
    description: |
      使用的Shell类型，默认为sh。

      **可选值：**
      - sh: 标准Shell（默认）
      - bash: Bash Shell
      - zsh: Z Shell
      - 其他系统可用的shell

      **示例值：**
      - "sh" (默认)
      - "bash"
      - "zsh"

      **注意事项：**
      - 确保指定的shell在系统中可用
      - 不同shell的命令语法可能略有差异
    required: false
    default: "sh"
  - name: "workdir"
    type: "string"
    description: |
      命令执行的工作目录。如果不指定，使用当前工作目录。

      **格式要求：**
      - 绝对路径或相对路径
      - 目录必须存在

      **示例值：**
      - "/tmp"
      - "/var/log"
      - "./data"
      - "/home/user/project"

      **注意事项：**
      - 确保目录存在且有访问权限
      - 相对路径相对于程序运行目录
    required: false
  - name: "additional_args"
    type: "string"
    description: |
      额外的exec参数。用于传递未在参数列表中定义的exec选项。

      **示例值：**
      - 根据工具特性添加常用参数示例

      **注意事项：**
      - 多个参数用空格分隔
      - 确保参数格式正确，避免命令注入
      - 此参数会直接追加到命令末尾
    required: false
    format: "positional"
